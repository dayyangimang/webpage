<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Halaman Dark</title>
    <style>
      :root {
        --bg: #222831;
        --panel: #2b3440;
        --card: #313b48;
        --text: #f5f7fa;
        --muted: #cbd5e1;
        --accent: #76abf3;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .container {
        width: min(900px, 90%);
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      }

      .badge {
        display: inline-block;
        background: rgba(118, 171, 243, 0.2);
        color: var(--accent);
        padding: 8px 14px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: bold;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      h1 {
        font-size: clamp(2.2rem, 5vw, 4rem);
        margin: 18px 0 12px;
      }

      p {
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.8;
        margin-bottom: 28px;
      }

      .btn {
        display: inline-block;
        text-decoration: none;
        padding: 12px 22px;
        border-radius: 12px;
        font-weight: 700;
        transition: 0.2s ease;
        background: var(--accent);
        color: #0d1320;
      }

      .btn:hover {
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="badge">hay sayang</div>
      <h1>Hayyy Diraaa</h1>
      <a href="next.html" class="btn">pencet dong</a>
    </div>
  </body>
</html>
